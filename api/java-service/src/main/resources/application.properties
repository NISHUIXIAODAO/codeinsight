server.port=3001
spring.application.name=java-service
# 默认使用 MySQL 作为主库；没有 MySQL 时可设置环境变量切换到 h2：
# SPRING_PROFILES_ACTIVE=h2
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=codeinsight-group

# DeepSeek Configuration
# deepseek.base-url=https://api.deepseek.com
# deepseek.model.chat=deepseek-chat
# deepseek.model.reasoner=deepseek-reasoner
# 不要把 Key 写进仓库文件里，推荐运行时通过环境变量注入：
# DEEPSEEK_API_KEY=xxxxx

# Pinecone Configuration (Vector Search)
# Pinecone Inference base url: https://api.pinecone.io
# pinecone.base-url=https://api.pinecone.io
# Pinecone API version header for /embed, example: 2025-10
# pinecone.api-version=2025-10
# Pinecone embedding model, example: llama-text-embed-v2
# pinecone.embed-model=llama-text-embed-v2
# Pinecone index host (Query/Upsert API host from console)
pinecone.index-host=https://codeinsight-98r6o8x.svc.aped-4627-b74a.pinecone.io
# 推荐用环境变量注入 Key：
PINECONE_API_KEY=pcsk_6Tysj1_SPB3CBM5RY5gSci1xvVSJuNUtKP7ZnT99Ce9DjG5aKKap1yxALksPBxBQfJd4pC

# MongoDB Configuration (用于存证据片段等文档型数据)
spring.data.mongodb.uri=mongodb://mongo:mongo@localhost:27017/codeinsight?authSource=admin

# Redis Configuration (用于会话短期缓存)
spring.redis.host=localhost
spring.redis.port=6379
